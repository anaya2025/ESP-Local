name: Build ESP32-S3 Factory Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual 1-click trigger from the Actions tab

jobs:
  build:
    name: Compile & Generate merged.bin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core & esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: PlatformIO Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Compile ESP32-S3 Firmware
        run: |
          pio run --target clean || true
          pio run

      - name: Assemble Factory merged.bin (Single Flash Image @ 0x0)
        run: |
          # 1. Locate PlatformIO output directory
          BUILD_DIR=$(find .pio/build -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "Build directory: $BUILD_DIR"

          # 2. Locate boot_app0.bin in Arduino framework packages
          BOOT_APP0=$(find ~/.platformio/packages -name "boot_app0.bin" 2>/dev/null | head -n 1)
          echo "boot_app0 location: $BOOT_APP0"

          # 3. Assemble command with 16MB partition offsets
          # 0x00000 = Bootloader
          # 0x08000 = Partition Table
          # 0x0F000 = boot_app0 (OTA switcher)
          # 0x20000 = app0 (Primary application firmware)
          MERGE_CMD="esptool.py --chip esp32s3 merge_bin -o $BUILD_DIR/merged.bin --flash_mode dio --flash_freq 80m --flash_size 16MB 0x0 $BUILD_DIR/bootloader.bin 0x8000 $BUILD_DIR/partitions.bin"

          if [ -n "$BOOT_APP0" ] && [ -f "$BOOT_APP0" ]; then
            echo "Attaching boot_app0 at 0xF000"
            MERGE_CMD="$MERGE_CMD 0xF000 $BOOT_APP0"
          fi

          MERGE_CMD="$MERGE_CMD 0x20000 $BUILD_DIR/firmware.bin"

          echo "Executing: $MERGE_CMD"
          eval $MERGE_CMD

          echo ">>> Successfully generated factory binary:"
          ls -lh $BUILD_DIR/merged.bin

      - name: Upload Single Factory merged.bin (Flash at 0x0)
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-factory-merged-bin
          path: .pio/build/*/merged.bin

      - name: Upload All Individual Firmware Binaries (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-all-binaries
          path: |
            .pio/build/*/merged.bin
            .pio/build/*/firmware.bin
            .pio/build/*/bootloader.bin
            .pio/build/*/partitions.bin
